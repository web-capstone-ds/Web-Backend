spring:
  datasource:
    url: jdbc:h2:mem:ds_backend;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

jwt:
  secret: test_secret_64_chars_min_test_secret_64_chars_min_test_secret_64_chars

ai-server:
  enabled: false
  base-url: http://127.0.0.1:8000
  service-token: test-service-token
