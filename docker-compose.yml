services:
  web-backend:
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    env_file: .env
    # 리눅스에서 AI_SERVER_URL=http://host.docker.internal:8000 해석을 위해 필요.
    # (macOS/Windows Docker Desktop은 자동, 리눅스는 명시 필요)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${PG_NAME}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    ports:
      - "127.0.0.1:${PG_HOST_PORT:-5433}:5432"
    volumes:
      - backend_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  backend_pg_data:
